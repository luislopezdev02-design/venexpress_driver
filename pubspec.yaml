name: venexpress_driver
description: App del repartidor de Venexpress.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Llamadas HTTP a la API de Laravel.
  http: ^1.2.1

  # Manejo de estado.
  provider: ^6.1.2

  # Guardar el token de Sanctum de forma segura en el dispositivo.
  flutter_secure_storage: ^9.2.2

  # Lector de códigos QR usando la cámara.
  mobile_scanner: ^5.2.3

  # Selección/captura de foto para la evidencia de entrega.
  image_picker: ^1.1.2

  # Ubicación GPS del repartidor, para ordenar sus entregas por distancia.
  geolocator: ^13.0.1

  # Formato de fechas y montos.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
