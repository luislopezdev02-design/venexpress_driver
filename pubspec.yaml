name: venexpress_driver
description: App del repartidor de Venexpress.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Llamadas HTTP a la API de Laravel.
  http: ^1.2.1

  # Manejo de estado.
  provider: ^6.1.2

  # Guardar el token de Sanctum de forma segura en el dispositivo.
  flutter_secure_storage: ^9.2.2

  # Lector de códigos QR usando la cámara.
  mobile_scanner: ^5.2.3

  # Selección/captura de foto para la evidencia de entrega.
  image_picker: ^1.1.2

  # Formato de fechas y montos.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Genera el ícono de la app (Android e iOS) a partir de una sola
  # imagen. Ver instrucciones abajo en flutter_launcher_icons.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# --- Ícono personalizado de la app ---
# 1. Pon tu logo en assets/icon/icon.png (imagen cuadrada, mínimo
#    1024x1024px, fondo el que quieras — para Android moderno lo ideal
#    es que el logo tenga algo de margen, ya que el sistema lo recorta
#    en distintas formas: círculo, cuadrado redondeado, etc.)
# 2. Corre: flutter pub get
# 3. Corre: dart run flutter_launcher_icons
# Esto reemplaza el ícono por defecto de Flutter en todas las
# resoluciones necesarias, tanto para debug como para release.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
